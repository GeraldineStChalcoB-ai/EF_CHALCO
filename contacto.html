<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Ciencias Sociales</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header class="d-flex justify-content-between align-items-center px-3 py-2">
  <h1 class="titulo">Ciencias Sociales</h1>

  <button id="menu-btn" class="menu-btn">☰</button>
</header>

<div id="overlay" class="overlay"></div>

<nav id="sideMenu" class="side-menu">
  <a href="index.html">Inicio</a>
  <a href="Descripcion.html">Descripción del Programa</a>
  <a href="Docentes.html">Docentes Especializados</a>
  <a href="contacto.html" class="active">Contacto</a>
</nav>

<main class="container contacto-container">
  <h2 class="text-center">Contacto</h2>

  <form id="formContacto" class="contacto-form">
    
      <label for="nombre">Nombre:</label>
      <input id="nombre" type="text" required>

      <label for="correo">Correo:</label>
      <input id="correo" type="email" required>

      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" required></textarea>

      <button class="btn btn-primary w-100 mt-3">Enviar</button>
  </form>

  <p id="confirmacion" class="text-center mt-3"></p>
</main>

<footer class="footer">
  <p>Facultad de Ciencias Sociales</p>
  <p class="footer-copy">© <span id="anio"></span> Universidad Continental</p>
</footer>

<script src="js/script.js"></script>
<script src="js/contacto.js"></script>
<script>
 document.getElementById("anio").textContent = new Date().getFullYear();
</script>
</body>
</html>
